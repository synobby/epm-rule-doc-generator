# Render "Blueprint": in Render, choose New > Blueprint and select this repo.
services:
  - type: web
    name: epm-rule-doc-generator
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    healthCheckPath: /_stcore/health   # Render restarts the app if this stops answering
    autoDeploy: true            # redeploys on every push to main
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: LLM_PROVIDER
        value: mistral          # free Experiment plan; or groq / gemini / openrouter / anthropic / openai
      - key: LLM_MODEL
        value: mistral-small-latest
      - key: LLM_REASONING_EFFORT
        value: low              # used only by providers that support it (groq, gemini, openai)
      - key: LLM_MAX_OUTPUT_TOKENS
        value: "6000"           # keeps each call inside Groq's free tokens-per-minute
      - key: LLM_API_KEY
        sync: false             # you type the secret in the Render dashboard; never commit it
      - key: MAX_LINES
        value: "2000"
      - key: WARN_LINES
        value: "1000"
