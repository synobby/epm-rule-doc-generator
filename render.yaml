# Render "Blueprint": in Render, choose New > Blueprint and select this repo.
services:
  - type: web
    name: epm-rule-doc-generator
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    healthCheckPath: /_stcore/health   # Render restarts the app if this stops answering
    autoDeploy: true            # redeploys on every push to main
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: LLM_PROVIDER
        value: gemini           # free tier; or anthropic / groq / openai
      - key: LLM_MODEL
        value: gemini-3.5-flash-lite  # Flash-Lite: higher free daily quota; copy exact ID from AI Studio
      - key: LLM_API_KEY
        sync: false             # you type the secret in the Render dashboard; never commit it
      - key: MAX_LINES
        value: "2000"
      - key: WARN_LINES
        value: "1000"
